<!doctype html><meta charset="utf-8"><title>Task 35 disposable preview acceptance</title>
<style>body{background:#1b2029;color:#dce5ef;font:14px system-ui;margin:18px}canvas{width:560px;height:350px;background:#121418}button{padding:10px}pre{white-space:pre-wrap}#shots{display:flex;gap:12px}.ew-note{color:#abbccc}dialog{background:#1b2029;color:#dce5ef;width:950px}.tp-pane{display:inline-block;vertical-align:top}#tpView{width:500px;height:320px}</style>
<h1>Task 35 · disposable acceptance</h1><p>Preview only · no saved data · physical fit/strength UNKNOWN</p>
<button id="rack">Compare rack before/after readPixels</button> <button id="bench">Run 12 timing rows (5 seconds each)</button>
<button id="depth">Depth-buffer check</button> <button id="restore">Context loss/restore</button> <button id="largeplace">Open large STL in Place on tray</button> <button id="place">Open example in Place on tray</button> <button id="cycles">20 open/close cycles</button>
<pre id="result"></pre><div id="shots"><section><h2>Original Canvas painter</h2><canvas id="before"></canvas></section><section><h2>WebGL preview</h2><canvas id="after"></canvas></section></div><div id="racks"></div>
<script src="/rack-references/rack-scene.js"></script><script src="/before/rack-studio.js"></script><script>const Before=LabRaxStudio;</script>
<script src="/rack-studio.js"></script><script src="/port-openings.js"></script><script src="/render-quality.js"></script><script src="/viewer-controls.js"></script><script src="/equipment-wizard.js"></script><script src="/tray-placement.js"></script><script src="/tray-pair.js"></script>
<script>
const activeContexts=new Set(),releasedContexts=[];let createdContexts=0;const OriginalPreview=LabRaxStudio.PreviewRenderer;LabRaxStudio.PreviewRenderer=class extends OriginalPreview{constructor(){super();createdContexts++;activeContexts.add(this);}dispose(...args){super.dispose(...args);activeContexts.delete(this);releasedContexts.push(this.gl);}};
let stressPlacement=false,stressVertices=null;const painterDraw=EquipmentPainter.draw;EquipmentPainter.draw=(cv,v)=>painterDraw(cv,stressPlacement&&cv.id==='tpView'?{...v,sets:[...v.sets,{v:stressVertices,color:[180,185,195],alpha:1}]}:v);
const result=document.querySelector('#result'),out={},frame=()=>new Promise(requestAnimationFrame),cvBefore=document.querySelector('#before'),cvAfter=document.querySelector('#after');
const example={"id": "eq-000000000004", "name": "Board example", "span": 1, "spec": {"name": "Board example", "dev_w": 85, "dev_d": 56, "dev_h": 20, "hole_d": 2.7, "standoff": 6, "insert_pilot": 3.2, "board_t": 1.6, "u": 1, "device_mount": "inserts", "joint": "screw", "rear_support": false, "dev_off_x": -1.5, "dev_off_y": 1, "dev_rot": 0, "holes": [[3.5, 3.5], [61.5, 3.5], [3.5, 52.5], [61.5, 52.5]], "ports": [], "rear_ports": [], "keystones": [], "planning_ports": [{"id": "usb-c-power", "label": "USB-C power", "type": "usb-c", "x": -32.8, "y": 11.5, "z": 18.8, "points": "front", "face": null}, {"id": "hdmi0", "label": "Micro-HDMI 0", "type": "micro-hdmi", "x": -18.05, "y": 11.2, "z": 18.8, "points": "front", "face": null}, {"id": "hdmi1", "label": "Micro-HDMI 1", "type": "micro-hdmi", "x": -4.55, "y": 11.2, "z": 18.8, "points": "front", "face": null}, {"id": "audio", "label": "Audio / composite 3.5 mm", "type": "other", "x": 10, "y": 10.6, "z": 20.6, "points": "front", "face": null}, {"id": "usb2-lower", "label": "USB 2.0 (lower)", "type": "usb-a", "x": 45, "y": 22, "z": 21.4, "points": "right", "face": null}, {"id": "usb2-upper", "label": "USB 2.0 (upper)", "type": "usb-a", "x": 45, "y": 22, "z": 29.4, "points": "right", "face": null}, {"id": "usb3-lower", "label": "USB 3.0 (lower)", "type": "usb-a", "x": 44.6, "y": 40, "z": 21.4, "points": "right", "face": null}, {"id": "usb3-upper", "label": "USB 3.0 (upper)", "type": "usb-a", "x": 44.6, "y": 40, "z": 29.4, "points": "right", "face": null}, {"id": "ethernet", "label": "Ethernet", "type": "rj45", "x": 44.2, "y": 58.75, "z": 24.4, "points": "right", "face": null}]}, "status": "PROPOSED \u2014 UNVALIDATED", "parts": [], "example": true, "template": "equipment_tray.scad", "provenance": "Historical board dimensions and 58 \u00d7 49 mm hole pitch; connector centres from local reference mesh, \u00b12 mm. No reference mesh redistributed. Face, cable access, fit and strength UNKNOWN."};
const view={yaw:.55,pitch:.65,zoom:1,quality:'task35',cen:[0,100,30],span:280};
const fixtureSets=()=>TrayPlacement.schematic(example.spec,TrayPlacement.values(example.spec));
const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');
document.querySelector('#rack').onclick=async()=>{try{
 const meshes=await LabRaxScene.load(fetch),scene=LabRaxScene.frame(5,true),box=LabRaxScene.bounds(scene,meshes),camera=LabRaxStudio.camera(box,.55,.65,800,600,1,true),rack={slots:5,placements:[]},logo=await (await fetch('/rack-references/rack-logo-faces.json')).json(),results=[];
 for(const [label,S] of [['before',Before],['after',LabRaxStudio]]){const r=new S.Renderer();r.logoFaces=logo.triangles;r.draw(scene,meshes,camera,800,600,rack);const pixels=new Uint8Array(800*600*4);r.gl.readPixels(0,0,800,600,r.gl.RGBA,r.gl.UNSIGNED_BYTE,pixels);results.push({label,sha256:await hash(pixels),stats:r.stats});const img=new Image();img.src=r.canvas.toDataURL();img.width=400;document.querySelector('#racks').append(img);r.dispose();r.gl.getExtension('WEBGL_lose_context')?.loseContext();}
 out.rack=results;out.rackEqual=results[0].sha256===results[1].sha256;result.textContent=JSON.stringify(out,null,2);
 }catch(e){result.textContent=e.stack;}};
function largeStl(){const n=160,m=256,v=[],point=(i,j)=>{const a=i*Math.PI/n,b=j*2*Math.PI/m;return [40*Math.sin(a)*Math.cos(b),80+30*Math.sin(a)*Math.sin(b),30+20*Math.cos(a)];};for(let i=0;i<n;i++)for(let j=0;j<m;j++){const a=point(i,j),b=point(i+1,j),c=point(i+1,j+1),d=point(i,j+1);v.push(...a,...b,...c,...a,...c,...d);}const buf=new ArrayBuffer(84+v.length/9*50),dv=new DataView(buf);dv.setUint32(80,v.length/9,true);for(let i=0;i<v.length/9;i++)for(let j=0;j<9;j++)dv.setFloat32(84+i*50+12+j*4,v[i*9+j],true);return EquipmentPainter.parseStl(buf);}
document.querySelector('#bench').onclick=async()=>{try{out.timings=[];const large=largeStl();out.largeTriangles=large.length/9;
 for(const device of ['example','large STL'])for(const renderer of ['canvas','webgl'])for(const level of ['low','medium','high']){
   RenderQuality.setPreviewLevel('task35',level);localStorage.setItem('assemblyWorkshop.previewRenderer',renderer==='canvas'?'canvas':'webgl');const cv=renderer==='canvas'?cvBefore:cvAfter;EquipmentPainter.dispose(cv);view.sets=fixtureSets();if(device==='large STL')view.sets.push({v:large,color:[180,185,195],alpha:1});
   const started=performance.now();let frames=0;while(performance.now()-started<5000){view.yaw=.55+Math.sin((performance.now()-started)/1200)*.7;EquipmentPainter.draw(cv,view);await frame();frames++;}
   await frame();out.timings.push({device,requested:renderer,level,...EquipmentPainter.stats,frames});result.textContent=JSON.stringify(out,null,2);
 }
 localStorage.removeItem('assemblyWorkshop.previewRenderer');RenderQuality.setPreviewLevel('task35','high');view.yaw=.55;view.sets=fixtureSets();EquipmentPainter.paint2d(cvBefore,view);EquipmentPainter.dispose(cvAfter);EquipmentPainter.draw(cvAfter,view);await frame();out.done=true;result.textContent=JSON.stringify(out,null,2);
 }catch(e){result.textContent=e.stack;}};
document.querySelector('#depth').onclick=async()=>{const S=LabRaxStudio,r=new S.PreviewRenderer(),M=S.Mesh,box=(z,color)=>{const m=new M();m.box(-20,20,-20,20,z,z+2);return {v:m.triangles.flatMap(t=>t.flatMap(i=>m.vertices[i])),color,alpha:1};},tray=box(0,[0,0,255]),device=box(10,[255,0,0]),samples=[];
for(const pitch of [Math.PI/2,-Math.PI/2])for(const sets of [[tray,device],[device,tray]]){r.draw(sets,{yaw:0,pitch,zoom:1,cen:[0,0,0],span:100},200,200,1);const px=new Uint8Array(4);r.gl.readPixels(100,100,1,1,r.gl.RGBA,r.gl.UNSIGNED_BYTE,px);samples.push({pitch,rgba:[...px],correct:pitch>0?px[0]>px[2]:px[2]>px[0]});}r.dispose();await frame();out.occlusion=samples;out.occlusionPass=samples.every(s=>s.correct);result.textContent=JSON.stringify(out,null,2);};
window.equipmentLibraryItems=()=>[example];window.equipmentLibraryItem=id=>id===example.id?example:null;
document.querySelector('#place').onclick=()=>{stressPlacement=false;return openTrayPlacement('task35-rack',{id:'task35-slot',equipment:example.id,slot:1,span:1});};
document.querySelector('#largeplace').onclick=async()=>{stressPlacement=true;stressVertices=largeStl();await openTrayPlacement('task35-rack',{id:'task35-slot',equipment:example.id,slot:1,span:1});await frame();out.largePlacement={...EquipmentPainter.stats,importedTriangles:stressVertices.length/9};result.textContent=JSON.stringify(out,null,2);};
document.querySelector('#restore').onclick=async()=>{stressPlacement=false;localStorage.removeItem('assemblyWorkshop.previewRenderer');view.sets=fixtureSets();EquipmentPainter.dispose(cvAfter);EquipmentPainter.draw(cvAfter,view);await frame();const r=[...activeContexts].find(r=>r.canvas.width===cvAfter.width),g=r.gl,ext=g.getExtension('WEBGL_lose_context'),lost=new Promise(resolve=>r.canvas.addEventListener('webglcontextlost',resolve,{once:true}));ext.loseContext();await lost;await frame();const fallback={...EquipmentPainter.stats};const restored=new Promise(resolve=>r.canvas.addEventListener('webglcontextrestored',resolve,{once:true}));ext.restoreContext();await restored;await frame();out.recovery={fallback,restored:{...EquipmentPainter.stats}};result.textContent=JSON.stringify(out,null,2);};
document.querySelector('#cycles').onclick=async()=>{for(let i=0;i<20;i++){await openTrayPlacement('task35-rack',{id:'task35-slot',equipment:example.id,slot:1,span:1});await frame();document.querySelector('#trayPlacement').close();await frame();}out.cycles={opened:20,created:createdContexts,released:releasedContexts.length,live:activeContexts.size,lost:releasedContexts.filter(g=>g.isContextLost()).length};result.textContent=JSON.stringify(out,null,2);};
</script>
