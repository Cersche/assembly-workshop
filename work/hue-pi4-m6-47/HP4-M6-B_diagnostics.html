<script>
"use strict";
const PARTS = JSON.parse(document.getElementById("data").textContent);
const COLORS = ["#d97757", "#6aa6e8", "#8fc46a", "#e2c25b", "#b58ae0", "#5fc9c0", "#e07a9f", "#a8a8a8"];
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { antialias: true, preserveDrawingBuffer: true });
if (!gl) { const e = document.getElementById("err"); e.style.display = "grid"; e.textContent = "WebGL is not available here."; throw 0; }

function b64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255); }

// ---- shaders
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
function program(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; }
const meshProg = program(
  `attribute vec3 p; attribute vec3 n; uniform mat4 mvp; varying vec3 vn;
   void main(){ vn = n; gl_Position = mvp * vec4(p, 1.0); }`,
  `precision mediump float; varying vec3 vn; uniform vec3 color; uniform vec3 eye;
   void main(){ vec3 n = normalize(vn); if (!gl_FrontFacing) n = -n;
     float head = max(dot(n, eye), 0.0); float sky = 0.5 + 0.5 * n.z;
     vec3 c = color * (0.25 + 0.15 * sky + 0.65 * head);
     gl_FragColor = vec4(c, 1.0); }`);
const lineProg = program(
  `attribute vec3 p; attribute vec3 c; uniform mat4 mvp; varying vec3 vc;
   void main(){ vc = c; gl_Position = mvp * vec4(p, 1.0); }`,
  `precision mediump float; varying vec3 vc; void main(){ gl_FragColor = vec4(vc, 1.0); }`);

// ---- decode parts into flat-shaded triangle soups
const scene = { lo: [Infinity, Infinity, Infinity], hi: [-Infinity, -Infinity, -Infinity] };
PARTS.forEach((part, k) => {
  const q = new Uint16Array(b64(part.pos));
  const idx = part.idx32 ? new Uint32Array(b64(part.idx)) : new Uint16Array(b64(part.idx));
  const pos = new Float32Array(idx.length * 3), nrm = new Float32Array(idx.length * 3);
  const v = i => [0, 1, 2].map(a => part.lo[a] + q[i * 3 + a] / 65535 * part.span[a]);
  for (let t = 0; t < idx.length; t += 3) {
    const A = v(idx[t]), B = v(idx[t + 1]), C = v(idx[t + 2]);
    const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], w = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
    const n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
    const l = Math.hypot(n[0], n[1], n[2]) || 1;
    [A, B, C].forEach((P, j) => { for (let a = 0; a < 3; a++) { pos[(t + j) * 3 + a] = P[a]; nrm[(t + j) * 3 + a] = n[a] / l; } });
  }
  part.count = idx.length; part.posArr = pos;
  part.pbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, part.pbuf); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  part.nbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, part.nbuf); gl.bufferData(gl.ARRAY_BUFFER, nrm, gl.STATIC_DRAW);
  part.color = COLORS[k % COLORS.length]; part.visible = true;
  part.hi = part.lo.map((x, a) => x + part.span[a]);
  for (let a = 0; a < 3; a++) { scene.lo[a] = Math.min(scene.lo[a], part.lo[a]); scene.hi[a] = Math.max(scene.hi[a], part.hi[a]); }
});

// ---- bed grid (10 mm, 50 mm major) and X/Y axes at Z=0
const grid = (() => {
  const pad = 20, x0 = Math.floor((Math.min(scene.lo[0], 0) - pad) / 50) * 50, x1 = Math.ceil((Math.max(scene.hi[0], 0) + pad) / 50) * 50;
  const y0 = Math.floor((Math.min(scene.lo[1], 0) - pad) / 50) * 50, y1 = Math.ceil((Math.max(scene.hi[1], 0) + pad) / 50) * 50;
  const d = [], minor = [0.24, 0.24, 0.24], major = [0.36, 0.36, 0.36];
  const seg = (a, b, c) => d.push(...a, ...c, ...b, ...c);
  for (let x = x0; x <= x1; x += 10) seg([x, y0, 0], [x, y1, 0], x === 0 ? [0.85, 0.3, 0.3] : x % 50 ? minor : major);
  for (let y = y0; y <= y1; y += 10) seg([x0, y, 0], [x1, y, 0], y === 0 ? [0.4, 0.8, 0.4] : y % 50 ? minor : major);
  seg([0, 0, 0], [0, 0, 20], [0.4, 0.6, 1.0]);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d), gl.STATIC_DRAW);
  return { buf, count: d.length / 6 };
})();

// ---- camera (Z up), orbit around target
const cam = { yaw: -Math.PI / 3, pitch: 0.55, dist: 200, target: [0, 0, 0] };
function frame(yaw, pitch) {
  const vis = PARTS.filter(p => p.visible), src = vis.length ? vis : PARTS;
  const lo = [0, 1, 2].map(a => Math.min(...src.map(p => p.lo[a]))), hi = [0, 1, 2].map(a => Math.max(...src.map(p => p.hi[a])));
  cam.target = lo.map((x, a) => (x + hi[a]) / 2);
  const r = Math.max(Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2, 5);
  const aspect = Math.min(1, (canvas.clientWidth || 1) / (canvas.clientHeight || 1));
  cam.dist = r / Math.sin(Math.atan(Math.tan(Math.PI / 8) * aspect)) * 1.05; cam.yaw = yaw; cam.pitch = pitch; draw();
}
function eyePos() { const c = Math.cos(cam.pitch);
  return [cam.target[0] + cam.dist * c * Math.cos(cam.yaw), cam.target[1] + cam.dist * c * Math.sin(cam.yaw), cam.target[2] + cam.dist * Math.sin(cam.pitch)]; }
function basis() { const e = eyePos(), f = norm(sub(cam.target, e)), r = norm(cross(f, [0, 0, 1])), u = cross(r, f); return { e, f, r, u }; }
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];

const norm = a => { const l = Math.hypot(...a) || 1; return a.map(x => x / l); };
function matrix() {
  const { e, f, r, u } = basis(), aspect = canvas.width / canvas.height;
  const near = cam.dist / 100, far = cam.dist * 20, t = 1 / Math.tan(Math.PI / 8);
  const P = [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0];
  const V = [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -dot(r, e), -dot(u, e), dot(f, e), 1];
  const M = new Float32Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += P[k * 4 + j] * V[i * 4 + k]; M[i * 4 + j] = s; }
  return { M, eye: norm(sub(e, cam.target)) };
}

// ---- draw
let pending = false;
function draw() { if (!pending) { pending = true; requestAnimationFrame(render); } }
function render() {
  pending = false;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h); gl.clearColor(0.118, 0.118, 0.118, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
  const { M, eye } = matrix();
  gl.useProgram(lineProg); gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, "mvp"), false, M);
  gl.bindBuffer(gl.ARRAY_BUFFER, grid.buf);
  const lp = gl.getAttribLocation(lineProg, "p"), lc = gl.getAttribLocation(lineProg, "c");
  gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(lc); gl.vertexAttribPointer(lc, 3, gl.FLOAT, false, 24, 12);
  gl.drawArrays(gl.LINES, 0, grid.count); gl.disableVertexAttribArray(lc);
  gl.useProgram(meshProg); gl.uniformMatrix4fv(gl.getUniformLocation(meshProg, "mvp"), false, M);
  gl.uniform3fv(gl.getUniformLocation(meshProg, "eye"), eye);
  const mp = gl.getAttribLocation(meshProg, "p"), mn = gl.getAttribLocation(meshProg, "n"), uc = gl.getUniformLocation(meshProg, "color");
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1, 1);
  for (const part of PARTS) {
    if (!part.visible) continue;
    gl.uniform3fv(uc, hex(part.color));
    gl.bindBuffer(gl.ARRAY_BUFFER, part.pbuf); gl.enableVertexAttribArray(mp); gl.vertexAttribPointer(mp, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, part.nbuf); gl.enableVertexAttribArray(mn); gl.vertexAttribPointer(mn, 3, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, part.count);
  }
  gl.disableVertexAttribArray(mn);
  lastM = M; drawOverlay();
}

// ---- part list
const list = document.getElementById("parts");
PARTS.forEach(part => {
  const row = document.createElement("label"); row.className = "part";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true;
  cb.onchange = () => { part.visible = cb.checked; draw(); };
  part.cb = cb;
  const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = part.color;
  const nm = document.createElement("span"); nm.className = "name"; nm.textContent = part.name;
  if (part.source) nm.title = part.source + " · " + part.tris + " triangles";
  const sz = document.createElement("span"); sz.className = "size";
  sz.textContent = part.span.map(s => (s < 1e-6 ? 0 : s).toFixed(1)).join(" × ") + " mm";
  row.append(cb, sw, nm, sz); list.append(row);
});
document.getElementById("reset").onclick = () => frame(-Math.PI / 3, 0.55);
document.getElementById("top").onclick = () => frame(-Math.PI / 2, Math.PI / 2 - 0.001);
document.getElementById("front").onclick = () => frame(-Math.PI / 2, 0);
document.getElementById("all").onclick = () => { PARTS.forEach(p => { p.visible = true; p.cb.checked = true; }); draw(); };

// ---- marks: pins and circles, anchored to 3D points so they follow the view
const ov = document.getElementById("ov"), ctx = ov.getContext("2d");
const marks = []; let mode = "orbit", stroke = null, lastM = null, nextId = 1;
const viewKey = () => [cam.yaw, cam.pitch, cam.dist, ...cam.target, canvas.width, canvas.height].join();
function ray(sx, sy) {
  const { e, f, r, u } = basis(), t = Math.tan(Math.PI / 8), W = canvas.clientWidth, H = canvas.clientHeight;
  const x = (sx / W * 2 - 1) * t * W / H, y = (1 - sy / H * 2) * t;
  return { o: e, d: norm([0, 1, 2].map(a => f[a] + r[a] * x + u[a] * y)), f };
}
function hit(sx, sy) {
  const { o, d, f } = ray(sx, sy); let best = null;
  for (const part of PARTS) {
    if (!part.visible) continue; const P = part.posArr;
    for (let i = 0; i < P.length; i += 9) {
      const e1 = [P[i + 3] - P[i], P[i + 4] - P[i + 1], P[i + 5] - P[i + 2]], e2 = [P[i + 6] - P[i], P[i + 7] - P[i + 1], P[i + 8] - P[i + 2]];
      const h = cross(d, e2), a = dot(e1, h); if (Math.abs(a) < 1e-12) continue;
      const s = [o[0] - P[i], o[1] - P[i + 1], o[2] - P[i + 2]], uu = dot(s, h) / a; if (uu < 0 || uu > 1) continue;
      const q = cross(s, e1), vv = dot(d, q) / a; if (vv < 0 || uu + vv > 1) continue;
      const tt = dot(e2, q) / a; if (tt > 1e-6 && (!best || tt < best.t)) best = { t: tt, part: part.name };
    }
  }
  if (!best && Math.abs(d[2]) > 1e-9 && -o[2] / d[2] > 0) best = { t: -o[2] / d[2], part: "bed (Z=0)" };
  if (!best) return null;
  const p = o.map((x, a) => x + d[a] * best.t);
  return { p, part: best.part, depth: dot(sub(p, o), f) };
}
const mmPerPx = depth => 2 * depth * Math.tan(Math.PI / 8) / canvas.clientHeight;
function project(p) {
  const M = lastM, w = M[3] * p[0] + M[7] * p[1] + M[11] * p[2] + M[15]; if (w <= 0) return null;
  const x = (M[0] * p[0] + M[4] * p[1] + M[8] * p[2] + M[12]) / w, y = (M[1] * p[0] + M[5] * p[1] + M[9] * p[2] + M[13]) / w;
  return [(x + 1) / 2 * canvas.clientWidth, (1 - y) / 2 * canvas.clientHeight, w];
}
function addPin(sx, sy) {
  const h = hit(sx, sy); if (!h || h.part === "bed (Z=0)" && !PARTS.some(p => p.visible)) return;
  marks.push({ id: nextId++, kind: "Pin", p: h.p, parts: [h.part], note: "" }); listNotes(true); draw();
}
function finishStroke() {
  const s = stroke; stroke = null; if (s.length < 4) { draw(); return; }
  const xs = s.map(q => q[0]), ys = s.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const hits = [];
  for (let i = 0; i <= 4; i++) for (let j = 0; j <= 4; j++) { const h = hit(x0 + (x1 - x0) * i / 4, y0 + (y1 - y0) * j / 4); if (h) hits.push(h); }
  const onPart = hits.filter(h => h.part !== "bed (Z=0)").sort((a, b) => a.depth - b.depth);
  let center = hit(cx, cy) || hits[0];
  if (!center) { draw(); return; }
  if (center.part === "bed (Z=0)" && onPart.length) center = onPart[0];
  const parts = onPart.length ? [...new Set(onPart.map(h => h.part))] : [center.part];
  const rPx = Math.max(x1 - x0, y1 - y0) / 2;
  marks.push({ id: nextId++, kind: "Circle", p: center.p, parts, note: "", rMm: rPx * mmPerPx(center.depth), path: s, key: viewKey() });
  listNotes(true); draw();
}
function drawOverlay() {
  const dpr = canvas.width / canvas.clientWidth;
  if (ov.width !== canvas.width || ov.height !== canvas.height) { ov.width = canvas.width; ov.height = canvas.height; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, ov.width, ov.height);
  ctx.lineWidth = 2.5; ctx.strokeStyle = "#ff4d4d"; ctx.font = "bold 12px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const path = s => { ctx.beginPath(); s.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); };
  const key = viewKey();
  for (const m of marks) {
    const s = project(m.p); if (!s) continue;
    let lx = s[0], ly = s[1];
    if (m.kind === "Circle") {
      if (m.key === key) { path(m.path); const ys = m.path.map(q => q[1]); ly = Math.min(...ys) - 12; }
      else { const r = m.rMm / mmPerPx(s[2]); ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.arc(s[0], s[1], r, 0, 7); ctx.stroke(); ctx.setLineDash([]); ly = s[1] - r - 12; }
    }
    ctx.fillStyle = "#ff4d4d"; ctx.beginPath(); ctx.arc(lx, ly, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText(m.id, lx, ly + 0.5);
  }
  if (stroke) path(stroke);
}
const fmt = p => "(" + p.map(x => x.toFixed(1)).join(", ") + ") mm";
const notesEl = document.getElementById("notes");
function listNotes(focusLast) {
  notesEl.textContent = "";
  marks.forEach(m => {
    const row = document.createElement("div"); row.className = "note";
    const t = document.createElement("span"); t.innerHTML = "<b>#" + m.id + "</b> " + m.kind;
    const del = document.createElement("button"); del.textContent = "×"; del.title = "Remove";
    del.onclick = () => { marks.splice(marks.indexOf(m), 1); listNotes(); draw(); };
    const where = document.createElement("span"); where.className = "where";
    where.textContent = m.parts.join(", ") + " · " + fmt(m.p) + (m.rMm ? " · ~" + (2 * m.rMm).toFixed(0) + " mm across" : "");
    const inp = document.createElement("input"); inp.placeholder = "Note for Claude…"; inp.value = m.note;
    inp.oninput = () => { m.note = inp.value; };
    row.append(t, document.createElement("span"), del, where, inp); notesEl.append(row);
    if (focusLast && m === marks[marks.length - 1]) setTimeout(() => inp.focus({ preventScroll: true }), 0);
  });
  if (window.innerWidth >= 500) document.getElementById("panel").open = true;
}
function notesText() {
  const deg = x => (x * 180 / Math.PI).toFixed(0);
  const lines = ["3D viewer notes: " + document.title,
    "View: yaw " + deg(cam.yaw) + "°, pitch " + deg(cam.pitch) + "°, target " + fmt(cam.target) + ", distance " + cam.dist.toFixed(0) + " mm",
    "Shown: " + PARTS.filter(p => p.visible).map(p => p.name).join(", ")];
  for (const m of marks) lines.push("#" + m.id + " " + m.kind + (m.rMm ? " ~" + (2 * m.rMm).toFixed(0) + " mm across" : "") +
    " at " + fmt(m.p) + " on " + m.parts.join(" + ") + (m.note ? ": " + m.note : ""));
  if (!marks.length) lines.push("(no marks)");
  return lines.join("\n");
}
const msg = t => { document.getElementById("msg").textContent = t; };
function picture() {
  render(); const c = document.createElement("canvas"); c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext("2d"); g.drawImage(canvas, 0, 0); g.drawImage(ov, 0, 0); return c;
}
function fallbackText(t) { const o = document.getElementById("out"); o.hidden = false; o.value = t; o.focus(); o.select(); }
document.getElementById("copyText").onclick = async () => {
  const t = notesText();
  try { await navigator.clipboard.writeText(t); msg("Notes copied. Paste them into the chat."); }
  catch { fallbackText(t); msg("Clipboard blocked here: the notes are selected below, press Ctrl+C."); }
};
document.getElementById("copyPic").onclick = () => picture().toBlob(async b => {
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": b })]); msg("Picture copied. Paste it into the chat."); }
  catch { msg("Clipboard blocked here: use Save picture instead."); }
});
document.getElementById("savePic").onclick = () => {
  const a = document.createElement("a"); a.href = picture().toDataURL("image/png");
  a.download = (document.title || "view").replace(/[^\w.-]+/g, "_") + "_marked.png"; a.click(); msg("Picture saved to Downloads.");
};
document.getElementById("clear").onclick = () => { marks.length = 0; nextId = 1; listNotes(); draw(); };
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode; document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b));
  document.body.classList.toggle("mark", mode !== "orbit");
});

// ---- mouse and touch
const pts = new Map(); let last = null;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); last = null;
  if (pts.size === 1 && e.button === 0 && !e.shiftKey) {
    if (mode === "pin") { pts.delete(e.pointerId); addPin(e.clientX, e.clientY); }
    else if (mode === "draw") stroke = [[e.clientX, e.clientY]];
  } else stroke = null;
});
canvas.addEventListener("pointerup", e => { pts.delete(e.pointerId); last = null; if (stroke) finishStroke(); });
canvas.addEventListener("pointercancel", e => { pts.delete(e.pointerId); last = null; });
function pan(dx, dy) {
  const { r, u } = basis(), s = 2 * cam.dist * Math.tan(Math.PI / 8) / canvas.clientHeight;
  cam.target = cam.target.map((x, a) => x - r[a] * dx * s + u[a] * dy * s);
}
canvas.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  if (stroke) { stroke.push([e.clientX, e.clientY]); pts.set(e.pointerId, [e.clientX, e.clientY]); draw(); return; }
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (last) { cam.dist *= last.d / d; pan(mid[0] - last.mid[0], mid[1] - last.mid[1]); }
    last = { mid, d }; draw(); return;
  }
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
  if (e.buttons & 2 || e.buttons & 4 || e.shiftKey) pan(dx, dy);
  else { cam.yaw -= dx * 0.008; cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch + dy * 0.008)); }
  draw();
});
canvas.addEventListener("wheel", e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.0012); draw(); }, { passive: false });
window.addEventListener("resize", draw);
if (window.innerWidth < 500) document.getElementById("panel").open = false;
frame(-Math.PI / 3, 0.55);
</script>
</body>
