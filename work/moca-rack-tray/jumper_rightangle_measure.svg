<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="15">
<rect width="900" height="560" fill="#fff"/>
<text x="20" y="30" font-size="20" font-weight="bold">ScreenBeam right-angle F: straight cable before the jumper can bend (top view)</text>
<text x="20" y="54" font-size="14">Real ScreenBeam, real right-angle F and the jumper cable, laid on the MRT-T1 jig or the bench. Plate/front is at the bottom.</text>
<!-- ScreenBeam -->
<rect x="120" y="330" width="420" height="190" fill="#cfe3f5" stroke="#333" stroke-width="2"/>
<text x="330" y="430" text-anchor="middle" font-weight="bold">ScreenBeam</text>
<text x="330" y="452" text-anchor="middle" font-size="13">front / plate side ↓</text>
<!-- port -->
<rect x="540" y="400" width="30" height="26" fill="#e0b84a" stroke="#333"/>
<!-- right-angle F body: out +x then up -->
<rect x="570" y="392" width="56" height="42" fill="#c9a640" stroke="#333"/>
<rect x="584" y="300" width="42" height="92" fill="#c9a640" stroke="#333"/>
<!-- crimp sleeve -->
<rect x="580" y="250" width="50" height="50" fill="#b48ee6" stroke="#333"/>
<!-- cable: straight, then bend toward splitter (left) -->
<path d="M605 250 L605 200 Q605 130 535 130 L330 130" fill="none" stroke="#9a6fd8" stroke-width="22" stroke-linecap="round"/>
<text x="330" y="112" text-anchor="middle">jumper → splitter OUT1</text>
<!-- port centre line -->
<line x1="500" y1="413" x2="800" y2="413" stroke="#c00" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="805" y="417" fill="#c00" font-size="13">port centre line</text>
<!-- E: port face to outer face (measured) -->
<g stroke="#2a7" fill="#2a7"><line x1="540" y1="470" x2="626" y2="470" stroke-width="2"/><line x1="540" y1="440" x2="540" y2="480"/><line x1="626" y1="440" x2="626" y2="480"/></g>
<text x="583" y="497" text-anchor="middle" fill="#2a7" font-weight="bold">24.6 ✓ measured</text>
<!-- C and D vertical dims on the right -->
<g stroke="#c00" fill="#c00">
<line x1="630" y1="250" x2="720" y2="250" stroke-dasharray="4 3"/>
<line x1="610" y1="200" x2="800" y2="200" stroke-dasharray="4 3"/>
<line x1="700" y1="413" x2="700" y2="250" stroke-width="2"/>
<line x1="780" y1="413" x2="780" y2="200" stroke-width="2"/>
</g>
<text x="690" y="335" text-anchor="end" fill="#c00" font-weight="bold" font-size="18">C</text>
<text x="790" y="310" fill="#c00" font-weight="bold" font-size="18">D</text>
<g font-size="14">
<text x="20" y="160" font-weight="bold" fill="#c00">Measure from the port centre line, toward the rear:</text>
<text x="20" y="182"><tspan font-weight="bold">C</tspan> = to the end of the crimp sleeve (purple).</text>
<text x="20" y="202">     Model now: 38.2 (from an old model, never measured)</text>
<text x="20" y="226"><tspan font-weight="bold">D</tspan> = to where the cable starts to curve</text>
<text x="20" y="246">     when it lies the way it wants (no pushing).</text>
<text x="20" y="266">     Model now: 39 (bend starts right at the tip)</text>
</g>
</svg>
