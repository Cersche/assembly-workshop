<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Arial, sans-serif" font-size="15">
<rect width="640" height="520" fill="#fff"/>
<text x="20" y="30" font-size="19" font-weight="bold">Splitter, looking down on the back face (the face that sits on the sled)</text>
<text x="20" y="54" fill="#444">Calipers. Measure to the CENTRE of each ear hole. Values in mm.</text>
<!-- body -->
<rect x="250" y="130" width="110" height="250" fill="#ddd" stroke="#333" stroke-width="2"/>
<text x="305" y="260" text-anchor="middle" fill="#555">body</text>
<!-- ports -->
<rect x="360" y="190" width="45" height="28" fill="#eee" stroke="#666"/><rect x="360" y="290" width="45" height="28" fill="#eee" stroke="#666"/>
<text x="415" y="210" fill="#555">OUT</text><text x="415" y="310" fill="#555">OUT</text>
<rect x="205" y="235" width="45" height="28" fill="#eee" stroke="#666"/><text x="160" y="255" fill="#555">IN</text>
<!-- ground tab -->
<rect x="310" y="96" width="34" height="34" fill="#f3e6c0" stroke="#996"/><text x="352" y="112" font-size="13" fill="#775">ground screw</text>
<!-- front ear (IN side, top) -->
<circle cx="275" cy="102" r="22" fill="#cfe3ff" stroke="#2a62c9" stroke-width="2"/><circle cx="275" cy="102" r="9" fill="#fff" stroke="#2a62c9" stroke-width="2"/>
<text x="150" y="92" fill="#2a62c9" font-weight="bold">front ear</text><text x="150" y="110" fill="#2a62c9" font-size="13">(the one you moved)</text>
<!-- rear ear (OUT side, bottom) -->
<circle cx="335" cy="408" r="22" fill="#cfe3ff" stroke="#2a62c9" stroke-width="2"/><circle cx="335" cy="408" r="9" fill="#fff" stroke="#2a62c9" stroke-width="2"/>
<text x="365" y="440" fill="#2a62c9">rear ear</text>
<!-- dim A -->
<line x1="275" y1="102" x2="110" y2="102" stroke="#c00" stroke-dasharray="4 3"/><line x1="250" y1="130" x2="110" y2="130" stroke="#c00" stroke-dasharray="4 3"/>
<line x1="120" y1="102" x2="120" y2="130" stroke="#c00" stroke-width="2"/>
<text x="30" y="122" fill="#c00" font-weight="bold">A</text>
<!-- dim B -->
<line x1="275" y1="102" x2="560" y2="102" stroke="#080" stroke-dasharray="4 3"/><line x1="335" y1="408" x2="560" y2="408" stroke="#080" stroke-dasharray="4 3"/>
<line x1="545" y1="102" x2="545" y2="408" stroke="#080" stroke-width="2"/>
<text x="555" y="260" fill="#080" font-weight="bold">B</text>
<text x="20" y="470" fill="#c00"><tspan font-weight="bold">A</tspan> = front body end face to the front ear hole centre, along the body. Model now: 4.9. If your 3 mm is right: about 1.9.</text>
<text x="20" y="494" fill="#080"><tspan font-weight="bold">B</tspan> = front ear hole centre to rear ear hole centre, along the body. Model now: 48.5 (your calipers).</text>
</svg>
