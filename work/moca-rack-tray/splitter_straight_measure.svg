<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif" font-size="15">
<rect width="900" height="520" fill="#fff"/>
<text x="20" y="30" font-size="20" font-weight="bold">MRT-T1 splitter: how much straight cable before it can bend (top view, real cable on the jig)</text>
<!-- splitter -->
<rect x="380" y="150" width="90" height="160" fill="#f2cf5b" stroke="#333" stroke-width="2"/>
<text x="425" y="235" text-anchor="middle" font-weight="bold">splitter</text>
<!-- IN left -->
<rect x="330" y="215" width="50" height="30" fill="#e0b84a" stroke="#333"/>
<rect x="282" y="208" width="52" height="44" fill="#b48ee6" stroke="#333"/>
<path d="M282 230 L200 230 Q140 230 140 290 L140 470" fill="none" stroke="#9a6fd8" stroke-width="22" stroke-linecap="round"/>
<text x="345" y="200" text-anchor="middle">IN</text>
<!-- OUT1 lower right (to ScreenBeam) -->
<rect x="470" y="255" width="50" height="30" fill="#e0b84a" stroke="#333"/>
<rect x="516" y="248" width="52" height="44" fill="#b48ee6" stroke="#333"/>
<path d="M568 270 L740 270 Q800 270 800 330 L800 470" fill="none" stroke="#9a6fd8" stroke-width="22" stroke-linecap="round"/>
<text x="495" y="320" text-anchor="middle">OUT1 → ScreenBeam</text>
<!-- OUT2 upper right (to rear) -->
<rect x="470" y="175" width="50" height="30" fill="#e0b84a" stroke="#333"/>
<rect x="516" y="168" width="52" height="44" fill="#b48ee6" stroke="#333"/>
<path d="M568 190 L620 190 Q680 190 680 130 L680 60" fill="none" stroke="#9a6fd8" stroke-width="22" stroke-linecap="round"/>
<text x="495" y="160" text-anchor="middle">OUT2 → rear</text>
<!-- dims A and B on OUT2 -->
<g stroke="#c00" fill="#c00">
<line x1="470" y1="110" x2="470" y2="140" stroke-width="1.5"/>
<line x1="568" y1="110" x2="568" y2="160" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="620" y1="80" x2="620" y2="170" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="470" y1="120" x2="568" y2="120" stroke-width="2"/>
<line x1="470" y1="90" x2="620" y2="90" stroke-width="2"/>
</g>
<text x="519" y="114" text-anchor="middle" fill="#c00" font-weight="bold">A</text>
<text x="545" y="84" text-anchor="middle" fill="#c00" font-weight="bold">B</text>
<!-- notes -->
<g font-size="14">
<text x="20" y="400" font-weight="bold" fill="#c00">Measure from the splitter body's side face, along the cable:</text>
<text x="20" y="422"><tspan font-weight="bold">A</tspan> = to the end of the crimp sleeve (purple). Model now: 25</text>
<text x="20" y="444"><tspan font-weight="bold">B</tspan> = to where the cable starts to curve when it lies</text>
<text x="20" y="464">     the way it wants (no pushing). Model now: IN 28.5, OUT2 28.5</text>
<text x="20" y="486">     (OUT1 runs straight to 72, but its channel walls start at 38).</text>
<text x="20" y="508">Give A and B for IN, OUT1 and OUT2. A ruler is fine.</text>
</g>
</svg>
