<rect x="40" y="345" width="270" height="133.2" fill="#eef2f7"/><text x="50" y="470" fill="#567">slot 9 below: OptiPlex (rear)</text>
<rect x="40" y="211.8" width="270" height="133.2" fill="#fff8e6" stroke="#c9a227" stroke-dasharray="4 3"/>
<text x="48" y="226" fill="#8a6d00">this slot: 44.4</text>
<rect x="40" y="273" width="168" height="60" fill="#e3e3e3"/><text x="70" y="300" fill="#666">channel walls to Z 24</text>
<rect x="40" y="264" width="138" height="9" fill="#9aa"/><text x="44" y="260" font-size="10" fill="#466">cover Z 24..27</text>
<rect x="40" y="333" width="168" height="12" fill="#777"/>
<rect x="196" y="279" width="12" height="54" fill="#555"/>
<path d="M40 319.5 H202 A90 90 0 0 0 292 229.5 V80" fill="none" stroke="#d2462d" stroke-width="5"/>
<path d="M202 319.5 A90 90 0 0 1 292 409.5 V478" fill="none" stroke="#2d6fd2" stroke-width="4" stroke-dasharray="8 5"/>
<line x1="310" y1="78" x2="310" y2="480" stroke="#000" stroke-width="2"/><text x="306" y="494" text-anchor="end" font-size="10">Y 240</text>
<line x1="157" y1="355" x2="157" y2="372" stroke="#000"/><line x1="202" y1="355" x2="202" y2="372" stroke="#000"/>
<line x1="157" y1="365" x2="202" y2="365" stroke="#000"/><text x="180" y="385" text-anchor="middle" font-weight="bold">15</text>
<text x="100" y="400" font-size="10">plan bend ends Y 189 · ramp starts Y 204</text>
