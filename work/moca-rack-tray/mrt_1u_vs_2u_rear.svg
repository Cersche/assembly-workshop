<!-- ===== summary ===== -->
<g font-size="12">
<text x="40" y="530" font-weight="bold">What the picture shows</text>
<text x="40" y="550">• The rack is only 240 deep, so the 15 mm between OUT2's plan bend and the ramp bend is set by depth, not height. 2U doesn't change it.</text>
<text x="40" y="568">• The coax has to leave the tray vertically either way (wall at the back). 2U only moves where the Up bend sits, not where the cable goes.</text>
<text x="40" y="586">• Rack is full: slots 1-9 all taken (slot 2 = ER605, in the rack but not yet in the app). A 2U tray means removing something.</text>
<text x="40" y="604">• Everything Brian proved on MRT-G / T4 (channel 10, lips 6.8 + 60°, R30, 48 / 58 straights) is in plan view and carries over to 2U unchanged.</text>
<text x="40" y="626" fill="#555">Cable centre Z 8.5 · rib top Z 22 · walls Z 24 · Up bend centre (Y 204, Z 38.5) · Down centre (Y 204, Z -21.5) · guide 5 outside the cable</text>
</g>
</svg>
