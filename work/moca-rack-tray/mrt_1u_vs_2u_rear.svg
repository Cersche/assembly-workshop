<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Arial, sans-serif" font-size="12">
<rect width="760" height="640" fill="#ffffff"/>
<text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold">MoCA tray rear, side view along the OUT2 coax (draft MRT-H numbers)</text>
<text x="380" y="42" text-anchor="middle" fill="#555">Y = depth (rear posts' rear face at Y 240), Z = height from the slot bottom. 3 px per mm. Same floor, rib and R30 ramp in both.</text>
