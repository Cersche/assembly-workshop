<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, sans-serif" font-size="14">
<rect width="900" height="470" fill="#fff"/>
<text x="20" y="28" font-size="19" font-weight="bold">Channel lip, cross-section (scale 15 px = 1 mm). Cable pushed in from the top.</text>
<!-- NOW -->
<g transform="translate(40,60)">
<text x="0" y="0" font-weight="bold">NOW (MRT-T1 / MRT.scad)</text>
<!-- wall: face at x=100, wall 2 thick to x=70; top z24 at y=40, floor z4 at y=340 -->
<rect x="70" y="40" width="30" height="300" fill="#e8825a" stroke="#333"/>
<rect x="250" y="40" width="30" height="300" fill="#e8825a" stroke="#333"/>
<rect x="70" y="340" width="210" height="20" fill="#e8825a" stroke="#333"/>
<!-- lip: flat top at wall_top, 0.5 vertical, 45 underside -->
<polygon points="100,40 148,40 148,47.5 100,95.5" fill="#d0603a" stroke="#333"/>
<circle cx="175" cy="272" r="52.5" fill="#b48ee6" stroke="#333"/>
<text x="175" y="277" text-anchor="middle">coax 7</text>
<line x1="148" y1="20" x2="250" y2="20" stroke="#c00"/><text x="199" y="15" text-anchor="middle" fill="#c00">gap 6.8</text>
<text x="160" y="70" fill="#c00">flat top, no lead-in:</text>
<text x="160" y="88" fill="#c00">cable has to squash past</text>
<text x="0" y="395">Lip sticks out 3.2 into a 10 channel</text>
<text x="0" y="413">Underside 45° = what keeps it in</text>
</g>
<!-- PROPOSED -->
<g transform="translate(480,60)">
<text x="0" y="0" font-weight="bold">PROPOSED: same underside, sloped top</text>
<rect x="70" y="40" width="30" height="300" fill="#e8825a" stroke="#333"/>
<rect x="250" y="40" width="30" height="300" fill="#e8825a" stroke="#333"/>
<rect x="70" y="340" width="210" height="20" fill="#e8825a" stroke="#333"/>
<!-- lead-in 60deg from horizontal: drops 5.5 over 3.2 -->
<polygon points="100,40 148,122.5 148,130 100,178" fill="#d0603a" stroke="#333"/>
<circle cx="175" cy="272" r="52.5" fill="#b48ee6" stroke="#333"/>
<text x="175" y="277" text-anchor="middle">coax 7</text>
<line x1="148" y1="20" x2="250" y2="20" stroke="#c00"/><text x="199" y="15" text-anchor="middle" fill="#c00">gap 6.8 (or 7.4)</text>
<text x="155" y="80" fill="#2a7">steep ramp on top:</text>
<text x="155" y="98" fill="#2a7">cable cams in</text>
<text x="0" y="395">Lip same 3.2, now 9.2 tall instead of 3.7</text>
<text x="0" y="413">Underside 45° unchanged, still clears the cable</text>
<text x="0" y="431">sitting on the floor</text>
</g>
</svg>
