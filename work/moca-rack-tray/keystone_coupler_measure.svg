<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif" font-size="14">
  <rect width="760" height="400" fill="#fff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">F keystone coupler: where is the 12 measured from? (side view, cut through the middle)</text>
  <text x="20" y="50" fill="#555">Tray inside on the left, back of the rack on the right. The coax from the splitter screws onto the left jack.</text>
  <!-- keystone body -->
  <rect x="330" y="110" width="150" height="160" fill="#cfd8e3" stroke="#333"/>
  <text x="405" y="290" text-anchor="middle">keystone body (snaps in)</text>
  <!-- front flange / face -->
  <rect x="480" y="95" width="14" height="190" fill="#9fb0c4" stroke="#333"/>
  <text x="487" y="88" text-anchor="middle">front face</text>
  <!-- jacks -->
  <rect x="200" y="170" width="130" height="40" fill="#e8c46a" stroke="#333"/>
  <rect x="494" y="170" width="90" height="40" fill="#e8c46a" stroke="#333"/>
  <text x="265" y="160" text-anchor="middle">inside jack (threads)</text>
  <text x="539" y="160" text-anchor="middle">rear jack</text>
  <!-- A -->
  <line x1="200" y1="225" x2="330" y2="225" stroke="#c0392b" stroke-width="2"/>
  <line x1="200" y1="215" x2="200" y2="235" stroke="#c0392b" stroke-width="2"/><line x1="330" y1="215" x2="330" y2="235" stroke="#c0392b" stroke-width="2"/>
  <text x="265" y="248" text-anchor="middle" fill="#c0392b" font-weight="bold">A: from the back of the body to the jack tip</text>
  <!-- B -->
  <line x1="200" y1="315" x2="494" y2="315" stroke="#2471a3" stroke-width="2"/>
  <line x1="200" y1="305" x2="200" y2="325" stroke="#2471a3" stroke-width="2"/><line x1="494" y1="305" x2="494" y2="325" stroke="#2471a3" stroke-width="2"/>
  <text x="347" y="340" text-anchor="middle" fill="#2471a3" font-weight="bold">B: from the front face to the inside jack tip (draft assumes 17)</text>
  <!-- C -->
  <line x1="494" y1="365" x2="584" y2="365" stroke="#1e8449" stroke-width="2"/>
  <line x1="494" y1="355" x2="494" y2="375" stroke="#1e8449" stroke-width="2"/><line x1="584" y1="355" x2="584" y2="375" stroke="#1e8449" stroke-width="2"/>
  <text x="539" y="390" text-anchor="middle" fill="#1e8449" font-weight="bold">C: rear jack past the front face</text>
  <text x="600" y="130" fill="#555">Also useful (calipers):</text>
  <text x="600" y="150" fill="#555">D: body depth, back to</text>
  <text x="600" y="168" fill="#555">front face</text>
  <text x="600" y="190" fill="#555">E: jack centre above the</text>
  <text x="600" y="208" fill="#555">body's bottom edge</text>
  <text x="600" y="228" fill="#555">(draft assumes ~18)</text>
</svg>
