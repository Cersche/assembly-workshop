<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Arial" font-size="14">
<rect width="1000" height="760" fill="#1d1f24"/>
<text x="20" y="30" fill="#fff" font-size="19" font-weight="bold">Rack top + 200 mm fan: what the stock top really is, two ways to fit the fan, what to measure</text>
<text x="20" y="52" fill="#9ab" font-size="13">Values from the creator's meshes placed as in the rack view (scale 1.6 px/mm). Source values, not measurements.</text>

<!-- SIDE SECTION (looking from the right side), Y front->rear left->right, Z up -->
<text x="20" y="82" fill="#9ab">1. SIDE SECTION through the middle (front on the left)</text>
<g transform="translate(40,330)">
  <!-- scale 1.6: Y 0..240 -> 0..384 ; Z 380..480 -> 0..-160 relative (z0=380) -->
  <!-- posts top region -->
  <rect x="0" y="-32" width="56" height="64" fill="#555"/><rect x="328" y="-32" width="56" height="64" fill="#555"/>
  <text x="4" y="26" fill="#ccc" font-size="11">front post</text><text x="332" y="26" fill="#ccc" font-size="11">rear post</text>
  <!-- front beam 45 deg: from (Y0,Z380) up to (Y32.5,Z435) and inner face Y35 -->
  <polygon points="0,0 52,-88 56,-88 56,-32 0,-32" fill="#777"/>
  <polygon points="384,0 332,-88 328,-88 328,-32 384,-32" fill="#777"/>
  <text x="-30" y="-50" fill="#ccc" font-size="11" transform="rotate(-58 10 -50)">45° front edge</text>
  <!-- panel Z430-433 Y34.25-205.75 -->
  <rect x="55" y="-85" width="274" height="5" fill="#bbb"/>
  <text x="150" y="-92" fill="#bbb" font-size="12">stock top panel, 3 thick</text>
  <!-- top of U9 at Z400.05 -->
  <line x1="56" y1="-32" x2="328" y2="-32" stroke="#888" stroke-dasharray="4 4"/>
  <text x="120" y="-38" fill="#aaa" font-size="11">top of slot 1 (U9), post tops, Z 400</text>
  <!-- headroom -->
  <line x1="300" y1="-80" x2="300" y2="-32" stroke="#7f7" stroke-width="2"/><text x="250" y="-55" fill="#7f7" font-weight="bold">E ≈ 30</text>
  <!-- flat top width -->
  <line x1="52" y1="-102" x2="332" y2="-102" stroke="#fc4" stroke-width="2"/>
  <text x="130" y="-108" fill="#fc4" font-weight="bold">C: flat top ≈ 175 (Y 32.5 to 207.5)</text>
  <!-- 200 fan -->
  <rect x="32" y="-150" width="320" height="40" fill="none" stroke="#5bd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="120" y="-125" fill="#5bd">200 mm fan, overhangs 12.5 front and rear</text>
  <line x1="0" y1="60" x2="384" y2="60" stroke="#ccc"/><text x="150" y="78" fill="#ccc" font-size="12">rack depth 240</text>
</g>

<!-- TOP VIEW -->
<text x="500" y="82" fill="#9ab">2. TOP VIEW (front at the bottom)</text>
<g transform="translate(720,330)">
  <!-- scale 1.2 here: X ±141 -> ±169 ; Y 0..240 -> 0..-288 -->
  <rect x="-169" y="-288" width="338" height="288" fill="#2b2f36" stroke="#888"/>
  <rect x="-169" y="-39" width="338" height="39" fill="#444"/><rect x="-169" y="-288" width="338" height="39" fill="#444"/>
  <text x="-60" y="-14" fill="#ccc" font-size="12">front 45° edge</text><text x="-55" y="-266" fill="#ccc" font-size="12">rear 45° edge</text>
  <rect x="-164" y="-246" width="28" height="204" fill="#666"/><rect x="136" y="-246" width="28" height="204" fill="#666"/>
  <text x="-160" y="-150" fill="#ddd" font-size="11" transform="rotate(-90 -148 -150)">handle</text><text x="152" y="-150" fill="#ddd" font-size="11" transform="rotate(-90 152 -150)">handle</text>
  <!-- handle M6 holes at X±124.73 Y55,185 -->
  <circle cx="-150" cy="-66" r="5" fill="#f77"/><circle cx="-150" cy="-222" r="5" fill="#f77"/><circle cx="150" cy="-66" r="5" fill="#f77"/><circle cx="150" cy="-222" r="5" fill="#f77"/>
  <text x="-120" y="-60" fill="#f77" font-size="12">M6 handle holes (the only screw points on top)</text>
  <!-- fan 200 centred Y120 -->
  <rect x="-120" y="-264" width="240" height="240" fill="none" stroke="#5bd" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="0" cy="-144" r="114" fill="none" stroke="#5bd" stroke-width="1"/>
  <text x="-34" y="-140" fill="#5bd">200 fan</text>
  <line x1="-136" y1="-170" x2="136" y2="-170" stroke="#fc4" stroke-width="2"/><text x="-80" y="-176" fill="#fc4" font-weight="bold">D: between handles ≈ 226.6</text>
  <line x1="-150" y1="10" x2="150" y2="10" stroke="#f77"/><text x="-90" y="26" fill="#f77" font-size="12">F: hole to hole across ≈ 249.5</text>
  <line x1="180" y1="-66" x2="180" y2="-222" stroke="#f77"/><text x="186" y="-130" fill="#f77" font-size="12">G ≈ 130</text>
</g>

<!-- OPTIONS -->
<text x="20" y="440" fill="#fff" font-size="16" font-weight="bold">Two ways to fit the fan</text>
<rect x="20" y="452" width="470" height="170" fill="#243a2c" stroke="#3a5"/>
<text x="32" y="474" fill="#7f7" font-weight="bold">A (recommended): new top only, keep stock edges + handles</text>
<text x="32" y="496" fill="#ddd" font-size="13">One printed "fan hat" replaces the stock panel. Its 3 mm lip drops into</text>
<text x="32" y="514" fill="#ddd" font-size="13">the same groove and is held down by the stock handles, exactly like the</text>
<text x="32" y="532" fill="#ddd" font-size="13">panel now. Above that, a raised frame holds the fan, a grille on top,</text>
<text x="32" y="550" fill="#ddd" font-size="13">and the fan overhangs the sloped edges by ~12.5 front and rear.</text>
<text x="32" y="568" fill="#ddd" font-size="13">~226 x 225 footprint, fits a 256 bed. Optional: M6 through the handles.</text>
<text x="32" y="592" fill="#ddd" font-size="13">Risk: low. Only the lip/handle trap must fit (copy stock panel values).</text>
<text x="32" y="610" fill="#ddd" font-size="13">Look: fan box stands ~35-40 above the edges, between the handles.</text>
<rect x="510" y="452" width="470" height="170" fill="#2b2f36" stroke="#888"/>
<text x="522" y="474" fill="#fc4" font-weight="bold">B: new front + rear top edges with a flat top 200+ deep</text>
<text x="522" y="496" fill="#ddd" font-size="13">Shorter slopes so the flat top grows to ~205, new panel holds the fan</text>
<text x="522" y="514" fill="#ddd" font-size="13">low and flush. Cleaner look, but 2 more big parts (~282 long, printed</text>
<text x="522" y="532" fill="#ddd" font-size="13">diagonally like the stock ones) and their joint over the post tops has</text>
<text x="522" y="550" fill="#ddd" font-size="13">to be redesigned: more to measure, more to get wrong.</text>
<text x="522" y="592" fill="#ddd" font-size="13">Risk: medium. Could still follow A later.</text>

<!-- MEASURE -->
<text x="20" y="652" fill="#fff" font-size="16" font-weight="bold">Please measure on your printed rack (top panel lifted out):</text>
<text x="20" y="674" fill="#fc4" font-size="13">C: flat top front to rear (top of front slope to top of rear slope), expected 175.  D: inside faces of the two handles, expected 226.6.</text>
<text x="20" y="694" fill="#7f7" font-size="13">E: underside of the top panel down to the top of the CM1000 (or bracket, whichever is higher), expected ≤ 30.</text>
<text x="20" y="714" fill="#f77" font-size="13">F/G: handle screw holes centre to centre, across 249.5 and front-rear 130.  H: the screw holding each handle (size x length).</text>
<text x="20" y="734" fill="#ccc" font-size="13">I: the stock panel itself: length x width x thickness, expected 228 x 171.5 x 3.  J: your printer's bed size.</text>
</svg>
