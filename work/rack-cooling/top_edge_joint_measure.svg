<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial" font-size="14">
<rect width="1000" height="640" fill="#1d1f24"/>
<text x="20" y="30" fill="#fff" font-size="19" font-weight="bold">Option B: measure the END of one stock top edge (front or rear, take it off the rack)</text>
<text x="20" y="52" fill="#9ab" font-size="13">The new edges copy only these joint sizes; everything else is our own shape. Expected values from the creator's mesh (not measurements). Scale 6 px/mm.</text>
<!-- side view of the edge end: Y horizontal (front left), Z vertical (up) -->
<text x="40" y="84" fill="#9ab">SIDE VIEW of the edge end (looking along the edge, front of the rack on the left)</text>
<g transform="translate(70,420)">
  <!-- Y 0..55 -> x 0..330 ; Z 380..435 -> y 120..-210  (z400 at y 0) -->
  <polygon points="0,0 210,-210 210,0" fill="#666" stroke="#aaa"/>
  <text x="40" y="-120" fill="#ccc" font-size="12" transform="rotate(-45 40 -120)">stock 45° face</text>
  <rect x="67" y="0" width="143" height="119" fill="#5a7" stroke="#bfb"/><text x="95" y="66" fill="#fff" font-weight="bold">PLUG</text>
  <rect x="210" y="-143" width="119" height="143" fill="#57a" stroke="#bbf"/><text x="228" y="-70" fill="#fff" font-weight="bold">TONGUE</text>
  <circle cx="135" cy="59" r="19" fill="#1d1f24" stroke="#fc4" stroke-width="2"/><circle cx="270" cy="-96" r="19" fill="#1d1f24" stroke="#fc4" stroke-width="2"/>
  <line x1="0" y1="0" x2="360" y2="0" stroke="#888" stroke-dasharray="4 4"/><text x="335" y="16" fill="#aaa" font-size="12">underside of the body (post top)</text>
  <!-- dims -->
  <line x1="67" y1="140" x2="210" y2="140" stroke="#7f7" stroke-width="2"/><text x="100" y="160" fill="#7f7" font-weight="bold">P1 plug length 23.9</text>
  <line x1="-20" y1="0" x2="-20" y2="119" stroke="#7f7" stroke-width="2"/><text x="-60" y="185" fill="#7f7" font-weight="bold">P2 plug drop 19.9</text>
  <line x1="0" y1="190" x2="67" y2="190" stroke="#7f7"/><text x="0" y="208" fill="#7f7" font-size="12">P3 face to plug 11.15</text>
  <line x1="210" y1="-160" x2="329" y2="-160" stroke="#8af" stroke-width="2"/><text x="215" y="-168" fill="#8af" font-weight="bold">T1 tongue length 19.85</text>
  <line x1="345" y1="0" x2="345" y2="-143" stroke="#8af" stroke-width="2"/><text x="352" y="-70" fill="#8af" font-weight="bold">T2 height 23.85</text>
  <text x="120" y="110" fill="#fc4" font-size="12">H1 Ø6.4</text><text x="250" y="-60" fill="#fc4" font-size="12">H2 Ø6.4</text>
</g>
<!-- end view thickness -->
<text x="560" y="84" fill="#9ab">FROM BELOW (end of the edge)</text>
<g transform="translate(600,140)">
  <rect x="0" y="0" width="300" height="70" fill="#666" stroke="#aaa"/><text x="80" y="40" fill="#ccc">edge, 282.25 long overall (L)</text>
  <rect x="220" y="70" width="41" height="60" fill="#5a7" stroke="#bfb"/>
  <line x1="220" y1="145" x2="261" y2="145" stroke="#7f7" stroke-width="2"/><text x="200" y="165" fill="#7f7" font-weight="bold">P4 plug thickness 6.86</text>
  <line x1="261" y1="185" x2="300" y2="185" stroke="#7f7"/><text x="215" y="205" fill="#7f7" font-size="12">P5 plug to end 7.14</text>
</g>
<text x="560" y="300" fill="#fff" font-size="15" font-weight="bold">Also tell me:</text>
<text x="560" y="324" fill="#ddd" font-size="13">H: what goes through holes H1 / H2 (screw, pin, nothing?)</text>
<text x="560" y="346" fill="#ddd" font-size="13">K: how the stock top panel went in: dropped in before</text>
<text x="560" y="364" fill="#ddd" font-size="13">   the handles, slid in, or snapped past the rail lips?</text>
<text x="560" y="386" fill="#ddd" font-size="13">E: underside of the top panel down to the top of the</text>
<text x="560" y="404" fill="#ddd" font-size="13">   CM1000 / its bracket (expected ≤ 30).</text>
<text x="560" y="426" fill="#ddd" font-size="13">J: printer bed size (edge is 282 long; on a 256 bed it</text>
<text x="560" y="444" fill="#ddd" font-size="13">   only fits diagonally).</text>
<text x="560" y="466" fill="#ddd" font-size="13">Fan: do you have the CT200 yet? If yes: frame thickness</text>
<text x="560" y="484" fill="#ddd" font-size="13">   (30?), corner radius, where the cables leave.</text>
<text x="20" y="560" fill="#fc4" font-size="13">Calipers: P1, P2, P4 and T1, T2 on the part itself. P3 = from the front bottom corner of the edge to the plug's front face. P5 = plug's outer face to the end of the edge.</text>
<text x="20" y="582" fill="#9ab" font-size="13">The draft fan clamp (grille on 4 posts) needs no fan screw holes, so the CT200's hole spacing doesn't matter unless you'd rather screw the fan down.</text>
</svg>
