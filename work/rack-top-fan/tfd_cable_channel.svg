<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI,Arial" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#06c"/></marker></defs>
<rect width="960" height="520" fill="#fff"/>
<text x="20" y="26" font-size="17" font-weight="bold">TF-D rear edge: DC jack hole removed, cable channel added. Is this it?</text>
<text x="20" y="46">My reading: cables come down from above/behind the rack and drop into the rack through a lay-in slot in the rear edge (no unplugging connectors).</text>

<!-- TOP VIEW -->
<g transform="translate(20,75)">
<text x="0" y="0" font-weight="bold">TOP VIEW, rear edge (back of the rack at the bottom)</text>
<rect x="0" y="20" width="420" height="110" fill="#cde" stroke="#333"/>
<text x="10" y="40">rear edge TRE-D (35 deep)</text>
<rect x="40" y="20" width="300" height="60" fill="#eee" stroke="#999"/><text x="120" y="55">fan cavity / grille</text>
<rect x="355" y="80" width="30" height="50" fill="#fff" stroke="#c00" stroke-width="2"/>
<text x="300" y="160" fill="#c00" font-weight="bold">NEW channel, open at the back</text>
<text x="300" y="176" fill="#c00">right rear corner, beside the fan,</text>
<text x="300" y="192" fill="#c00">above the fan junction box</text>
<line x1="355" y1="145" x2="385" y2="145" stroke="#06c" marker-start="url(#a)" marker-end="url(#a)"/><text x="358" y="141" fill="#06c" font-size="11">20?</text>
<line x1="395" y1="80" x2="395" y2="130" stroke="#06c" marker-start="url(#a)" marker-end="url(#a)"/><text x="399" y="110" fill="#06c" font-size="11">15?</text>
<circle cx="72" cy="118" r="7" fill="none" stroke="#999" stroke-dasharray="3"/><line x1="64" y1="110" x2="80" y2="126" stroke="#999"/><line x1="80" y1="110" x2="64" y2="126" stroke="#999"/>
<text x="20" y="150" fill="#666">old DC jack hole: GONE (rear-left pad becomes whole)</text>
<text x="0" y="128" font-size="11">back face</text>
</g>

<!-- SECTION -->
<g transform="translate(520,75)">
<text x="0" y="0" font-weight="bold">SIDE SECTION through the channel</text>
<path d="M60 40 L140 40 L180 80 L180 240 L60 240 Z" fill="#cde" stroke="#333"/>
<text x="70" y="160">rear edge</text>
<rect x="140" y="40" width="40" height="200" fill="#fff" stroke="#c00" stroke-width="2"/>
<path d="M240 20 C200 20 170 30 160 60 L160 300" fill="none" stroke="#333" stroke-width="5"/>
<text x="190" y="18">cable from above / behind</text>
<text x="170" y="300">into the rack</text>
<text x="0" y="40">inside</text><text x="200" y="250">back of rack</text>
<text x="0" y="330">Slot runs the full 50 height of the edge,</text>
<text x="0" y="346">open at the back so a plugged cable lays in.</text>
</g>
<text x="20" y="440" font-weight="bold">Questions answered by your OK or a correction:</text>
<text x="20" y="460">1. Which cables (fan leads, power, network)? Size 20 x 15 is a guess for a small bundle.</text>
<text x="20" y="478">2. Right rear corner (above the junction box) OK, or somewhere else?</text>
</svg>
