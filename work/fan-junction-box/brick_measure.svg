<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
</defs>
<rect width="940" height="600" fill="#fff"/>
<text x="20" y="26" font-size="17" font-weight="bold">Where to measure: GuanTing 12 V brick + screw-terminal socket tip</text>
<text x="20" y="46" fill="#555">Calipers, mm. Expected values are rough guesses from similar adapters, not from the listing. Measure the real parts.</text>

<!-- Brick front view -->
<text x="40" y="84" font-weight="bold">1. Brick, prong side facing you</text>
<rect x="80" y="110" width="170" height="230" rx="14" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
<rect x="135" y="170" width="8" height="40" fill="#90a4ae"/><rect x="187" y="170" width="8" height="40" fill="#90a4ae"/>
<circle cx="165" cy="235" r="0" />
<text x="165" y="300" text-anchor="middle" fill="#555">cord exits</text>
<text x="165" y="316" text-anchor="middle" fill="#555">bottom?</text>
<line x1="80" y1="360" x2="250" y2="360" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="165" y="380" text-anchor="middle" fill="#c62828" font-weight="bold">A width (~45)</text>
<line x1="60" y1="110" x2="60" y2="340" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="52" y="230" text-anchor="end" fill="#c62828" font-weight="bold">B</text>
<text x="52" y="246" text-anchor="end" fill="#c62828">height</text>
<text x="52" y="262" text-anchor="end" fill="#c62828">(~70)</text>
<line x1="265" y1="110" x2="265" y2="170" stroke="#c62828" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="272" y="138" fill="#c62828">E top</text>
<text x="272" y="154" fill="#c62828">to prongs</text>

<!-- Brick side view -->
<text x="340" y="84" font-weight="bold">2. Brick from the side</text>
<rect x="380" y="110" width="90" height="230" rx="12" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
<rect x="350" y="170" width="30" height="8" fill="#90a4ae"/><rect x="350" y="200" width="30" height="8" fill="#90a4ae"/>
<text x="345" y="230" text-anchor="end" fill="#555" font-size="11">prongs</text>
<path d="M425,340 C425,380 440,400 470,410" fill="none" stroke="#37474f" stroke-width="4"/>
<line x1="380" y1="360" x2="470" y2="360" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="425" y="380" text-anchor="middle" fill="#c62828" font-weight="bold">C depth (~35)</text>
<text x="480" y="160" fill="#c62828">D: where the cord leaves</text>
<text x="480" y="176" fill="#c62828">(which face, and its distance</text>
<text x="480" y="192" fill="#c62828">from the nearest edge)</text>
<text x="480" y="220" fill="#555">Also: any ribs, labels or a</text>
<text x="480" y="236" fill="#555">sloped face a clamp must clear?</text>

<!-- Socket tip -->
<text x="40" y="450" font-weight="bold">3. Screw-terminal socket tip, from the side (green block up)</text>
<rect x="80" y="490" width="110" height="34" rx="6" fill="#263238"/>
<text x="135" y="512" text-anchor="middle" fill="#fff" font-size="11">barrel socket</text>
<rect x="190" y="472" width="70" height="70" rx="4" fill="#43a047"/>
<circle cx="210" cy="482" r="5" fill="#cfd8dc"/><circle cx="240" cy="482" r="5" fill="#cfd8dc"/>
<text x="225" y="515" text-anchor="middle" fill="#fff" font-size="11">+ / −</text>
<line x1="80" y1="565" x2="260" y2="565" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="170" y="588" text-anchor="middle" fill="#c62828" font-weight="bold">F overall length (~40)</text>
<line x1="60" y1="490" x2="60" y2="524" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="40" y="478" fill="#c62828" font-weight="bold">G barrel OD (~11)</text>
<line x1="280" y1="472" x2="280" y2="542" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="288" y="505" fill="#c62828" font-weight="bold">H block height (~14)</text>
<text x="288" y="523" fill="#c62828" font-weight="bold">I block width across (~15)</text>

<text x="560" y="440" font-weight="bold">4. Brick plug end (the one that goes into the tip)</text>
<rect x="580" y="490" width="70" height="30" rx="4" fill="#263238"/>
<rect x="650" y="497" width="40" height="16" fill="#9e9e9e"/>
<path d="M580,505 H540" stroke="#263238" stroke-width="5"/>
<line x1="580" y1="545" x2="690" y2="545" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="635" y="566" text-anchor="middle" fill="#c62828" font-weight="bold">J plug body + pin length (~40)</text>
<line x1="710" y1="490" x2="710" y2="520" stroke="#c62828" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="718" y="510" fill="#c62828" font-weight="bold">K plug body OD (~10)</text>
<text x="560" y="590" fill="#555">J and K size the hole the barrel enters through.</text>
</svg>
