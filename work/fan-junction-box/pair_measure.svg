<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif" font-size="15">
<rect width="900" height="620" fill="#fff"/>
<text x="20" y="32" font-size="20" font-weight="bold">Fan junction box option B: what to measure (calipers, plugs pushed fully together)</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<!-- top view of mated pair -->
<text x="20" y="70" font-weight="bold">1. Top view: CT200 plug + extension plug, mated</text>
<line x1="40" y1="150" x2="150" y2="150" stroke="#555" stroke-width="6"/>
<rect x="150" y="115" width="150" height="70" fill="#333"/>
<rect x="300" y="112" width="140" height="76" fill="#555"/>
<line x1="440" y1="150" x2="560" y2="150" stroke="#555" stroke-width="6"/>
<text x="175" y="155" fill="#fff">fan plug</text><text x="315" y="155" fill="#fff">extension plug</text>
<text x="40" y="140">fan wires</text><text x="470" y="140">to Pi / Wagos</text>
<line x1="150" y1="215" x2="440" y2="215" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="150" y1="190" x2="150" y2="222" stroke="#c0392b"/><line x1="440" y1="192" x2="440" y2="222" stroke="#c0392b"/>
<text x="210" y="240" fill="#c0392b" font-weight="bold">L = plastic end to plastic end, expect ~26 mm</text>
<line x1="470" y1="112" x2="470" y2="188" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)" transform="translate(110,0)"/>
<text x="595" y="150" fill="#c0392b" font-weight="bold">W = widest part incl. latch,</text>
<text x="595" y="170" fill="#c0392b" font-weight="bold">expect ~11.5 mm</text>
<!-- side view -->
<text x="20" y="290" font-weight="bold">2. Side view (same pair, turned 90 deg)</text>
<rect x="150" y="330" width="150" height="45" fill="#333"/>
<rect x="300" y="326" width="140" height="53" fill="#555"/>
<rect x="320" y="318" width="40" height="8" fill="#555"/>
<text x="325" y="314" font-size="12">latch</text>
<line x1="470" y1="318" x2="470" y2="379" stroke="#c0392b" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="485" y="345" fill="#c0392b" font-weight="bold">H = tallest point incl. latch, expect ~7.5 mm</text>
<text x="20" y="420">Do this for BOTH pairs: the 4-pin PWM (CT200 4-pin + 4-pin extension) and the 3-pin ARGB (CT200 3-pin + ARGB extension).</text>
<text x="20" y="442">The draft pocket is 28.5 long x 12.5 wide, the two pairs stacked (15 mm of 17.2 inner height). Tell me L, W, H of each.</text>
<!-- extension length -->
<text x="20" y="490" font-weight="bold">3. Extension length (tape measure, along the cable route)</text>
<text x="20" y="514">From the right rear post at the top of slot 1 (U9, the junction box), straight down the rear post lane to the Pi in slots 5-6,</text>
<text x="20" y="536">then across to the Pi's GPIO header. Expect roughly 30 cm (about 4.5 U down + across); buy extensions at least 10 cm longer.</text>
<text x="20" y="558">Also, if easy: how long the CT200's own 4-pin and 3-pin leads are from the fan frame to the plug end (expect ~30-50 cm).</text>
<text x="20" y="600" font-size="13" fill="#666">All values above are typical guesses (UNKNOWN). Draft only: nothing is printed until you say so.</text>
</svg>
