<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="900" height="570" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold">Fan junction box: what goes through it (concept v2: PWM + tach, not to scale)</text>
  <text x="20" y="48" fill="#555">Proposal for Brian 2026-11-07. Wire colours are typical fan colours; check yours. Nothing designed yet.</text>

  <!-- Brick / jack -->
  <rect x="20" y="110" width="150" height="70" rx="6" fill="#eee" stroke="#333"/>
  <text x="30" y="132" font-weight="bold">12 V 2 A brick</text>
  <text x="30" y="150">plug into its screw-</text>
  <text x="30" y="166">terminal socket tip (+ / -)</text>

  <!-- Box -->
  <rect x="240" y="80" width="330" height="300" rx="10" fill="#f7f9ff" stroke="#2255aa" stroke-width="2.5"/>
  <text x="252" y="102" font-weight="bold" fill="#2255aa">JUNCTION BOX (passive, Wagos only)</text>

  <rect x="270" y="120" width="120" height="40" rx="4" fill="#ffd9d9" stroke="#aa0000"/>
  <text x="278" y="138" font-weight="bold">+12 V bus</text><text x="278" y="154">221-413 (3 way)</text>

  <rect x="270" y="180" width="120" height="40" rx="4" fill="#dddddd" stroke="#000"/>
  <text x="278" y="198" font-weight="bold">GND bus</text><text x="278" y="214">221-415 (5 way)</text>

  <rect x="270" y="240" width="120" height="40" rx="4" fill="#ffe9c9" stroke="#cc7700"/>
  <text x="278" y="258" font-weight="bold">ARGB +5 V</text><text x="278" y="274">221-412 (2 way)</text>

  <rect x="270" y="300" width="120" height="40" rx="4" fill="#d9f0d9" stroke="#227722"/>
  <text x="278" y="318" font-weight="bold">ARGB DATA</text><text x="278" y="334">221-412 (2 way)</text>

  <rect x="420" y="240" width="130" height="40" rx="4" fill="#e6e0ff" stroke="#5533aa"/>
  <text x="428" y="258" font-weight="bold">PWM</text><text x="428" y="274">221-412 (2 way)</text>
  <rect x="420" y="300" width="130" height="40" rx="4" fill="#dff3ff" stroke="#227799"/>
  <text x="428" y="318" font-weight="bold">TACH</text><text x="428" y="334">221-412 (2 way)</text>

  <!-- brick wires -->
  <line x1="170" y1="135" x2="270" y2="135" stroke="#cc0000" stroke-width="3"/>
  <line x1="170" y1="160" x2="230" y2="160" stroke="#000" stroke-width="3"/>
  <line x1="230" y1="160" x2="230" y2="195" stroke="#000" stroke-width="3"/>
  <line x1="230" y1="195" x2="270" y2="195" stroke="#000" stroke-width="3"/>

  <!-- CT200 -->
  <rect x="660" y="90" width="220" height="150" rx="6" fill="#eee" stroke="#333"/>
  <text x="670" y="112" font-weight="bold">CT200 fan (top)</text>
  <text x="670" y="132">4-pin: 12 V, GND, tach, PWM</text>
  <text x="670" y="150">3-pin ARGB: 5 V, DATA, GND</text>
  <text x="670" y="176" fill="#555">Fan stays unmodified: plugs into</text>
  <text x="670" y="192" fill="#555">cut extension pigtails (female)</text>
  <text x="670" y="208" fill="#555">whose bare ends go in the Wagos</text>
  <line x1="390" y1="130" x2="660" y2="130" stroke="#cc0000" stroke-width="2"/>
  <line x1="390" y1="190" x2="660" y2="148" stroke="#000" stroke-width="2"/>
  <line x1="390" y1="200" x2="660" y2="160" stroke="#000" stroke-width="2"/>
  <line x1="390" y1="255" x2="660" y2="170" stroke="#cc7700" stroke-width="2"/>
  <line x1="390" y1="315" x2="660" y2="180" stroke="#227722" stroke-width="2"/>
  <line x1="550" y1="255" x2="660" y2="140" stroke="#5533aa" stroke-width="2"/>
  <line x1="550" y1="320" x2="660" y2="136" stroke="#227799" stroke-width="2"/>
  <line x1="485" y1="280" x2="485" y2="300" stroke="none"/>
  <line x1="540" y1="280" x2="540" y2="420" stroke="#5533aa" stroke-width="2"/>
  <line x1="530" y1="340" x2="530" y2="420" stroke="#227799" stroke-width="2"/>

  <!-- cable down -->
  <rect x="240" y="420" width="330" height="40" rx="6" fill="#fffbe6" stroke="#998800"/>
  <text x="252" y="438" font-weight="bold">ONE 6-core cable down the rack to the Pi</text>
  <text x="252" y="454">12 V, GND, 5 V, DATA, PWM, TACH (length UNKNOWN)</text>
  <line x1="300" y1="160" x2="300" y2="170" stroke="#cc0000" stroke-width="2"/>
  <line x1="255" y1="140" x2="255" y2="420" stroke="#cc0000" stroke-width="2"/>
  <line x1="255" y1="140" x2="270" y2="140" stroke="#cc0000" stroke-width="2"/>
  <line x1="262" y1="210" x2="262" y2="420" stroke="#000" stroke-width="2"/>
  <line x1="262" y1="210" x2="270" y2="210" stroke="#000" stroke-width="2"/>
  <line x1="330" y1="280" x2="330" y2="300" stroke="none"/>
  <line x1="395" y1="265" x2="405" y2="265" stroke="#cc7700" stroke-width="2"/>
  <line x1="405" y1="265" x2="405" y2="420" stroke="#cc7700" stroke-width="2"/>
  <line x1="390" y1="265" x2="405" y2="265" stroke="#cc7700" stroke-width="2"/>
  <line x1="390" y1="330" x2="412" y2="330" stroke="#227722" stroke-width="2"/>
  <line x1="412" y1="330" x2="412" y2="420" stroke="#227722" stroke-width="2"/>

  <!-- Pi end -->
  <rect x="610" y="400" width="270" height="150" rx="6" fill="#eef7ee" stroke="#227722"/>
  <text x="620" y="422" font-weight="bold">At the Pi (slot 5-6), not in the box</text>
  <text x="620" y="442">12 V + GND -> Pi 40 x 10 fan</text>
  <text x="620" y="460">5 V -> pin 2, GND -> pin 6</text>
  <text x="620" y="478">DATA via 74AHCT125 -> GPIO10 (pin 19, SPI)</text>
  <text x="620" y="496">PWM via spare 74AHCT125 ch <- GPIO12/13</text><text x="620" y="512">TACH (3.3 V pull-up) -> any GPIO</text>
  <text x="620" y="528" fill="#555">Shifter + optional MOSFET stay at the Pi.</text>
  
  <line x1="570" y1="440" x2="610" y2="460" stroke="#998800" stroke-width="3"/>

  <text x="20" y="500" fill="#aa0000" font-weight="bold">Shared ground:</text>
  <text x="20" y="518" fill="#aa0000">brick GND = Pi GND, tied once</text>
  <text x="20" y="536" fill="#aa0000">in the GND bus (DATA needs it).</text>
</svg>
